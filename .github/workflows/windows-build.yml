name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # publish the installer to the rolling "build-latest" release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Bundle FIRST, while setup-python's install is still clean (no dev
      # tools in it). The app runs on python.org's own signed pythonw.exe
      # instead of a PyInstaller exe, which Defender's ML scan flags as a
      # trojan (see packaging/launch.py).
      - name: Bundle the app with the signed python.org runtime
        shell: pwsh
        run: |
          $src = Split-Path (Get-Command python).Source
          $app = "dist/ValdoSniper"
          New-Item -ItemType Directory -Force $app | Out-Null
          Copy-Item -Recurse $src "$app/python"
          foreach ($junk in "Lib/test", "Lib/idlelib", "Lib/ensurepip", "include", "libs", "Tools", "Doc", "Scripts") {
            Remove-Item -Recurse -Force "$app/python/$junk" -ErrorAction SilentlyContinue
          }
          $py = "$app/python/python.exe"
          $deps = & $py -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))"
          & $py -m pip install --no-warn-script-location --disable-pip-version-check $deps
          if ($LASTEXITCODE -ne 0) { throw "dependency install failed" }
          Copy-Item -Recurse sniper, userscript "$app/"
          Copy-Item packaging/launch.py, "packaging/Valdo Sniper.cmd" "$app/"
          Get-ChildItem $app -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          & $py -c "import tkinter, win32gui, keyboard, psutil, websockets, httpx, yaml, dotenv; tkinter.Tcl()"
          if ($LASTEXITCODE -ne 0) { throw "bundled runtime is missing a module" }
          # the binaries that actually run must carry a valid publisher signature
          foreach ($exe in "python.exe", "pythonw.exe", "python312.dll") {
            $sig = Get-AuthenticodeSignature "$app/python/$exe"
            if ($sig.Status -ne "Valid") { throw "$exe is not validly signed: $($sig.Status)" }
            "$exe signed by $($sig.SignerCertificate.Subject)"
          }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests (real Windows - the win32 paths only run here)
        run: python -m pytest -q
      - name: Smoke-test the bundled app
        shell: pwsh
        run: |
          Copy-Item tests/fixtures/replay_config.yaml dist/ValdoSniper/config.yaml
          $p = Start-Process dist/ValdoSniper/python/python.exe -ArgumentList "launch.py", "--headless" -WorkingDirectory dist/ValdoSniper -PassThru
          Start-Sleep 6
          $script = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8766/valdo-sniper.user.js
          Stop-Process $p
          if ($script.Content -notmatch "@version") { throw "bundled userscript not served" }
          Remove-Item dist/ValdoSniper/config.yaml
          Remove-Item -Recurse -Force dist/ValdoSniper/logs -ErrorAction SilentlyContinue
          Get-ChildItem dist/ValdoSniper -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
      - name: Portable zip (no installer, for when Defender blocks it anyway)
        shell: pwsh
        run: |
          Copy-Item config.yaml, SETUP.md dist/ValdoSniper/
          Copy-Item .env.example dist/ValdoSniper/.env
          Compress-Archive -Path dist/ValdoSniper/* -DestinationPath dist/ValdoSniper-portable.zip
          Remove-Item dist/ValdoSniper/config.yaml, dist/ValdoSniper/SETUP.md, dist/ValdoSniper/.env
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc /DAppVersion=$v packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: ValdoSniper-Setup
          path: |
            dist/ValdoSniper-Setup.exe
            dist/ValdoSniper-portable.zip
      - name: Publish to the build-latest release
        # main, or a manual run (to test a branch build before it merges)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Windows installer built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. The app runs on python.org's signed pythonw.exe; only the installer itself is unsigned, so SmartScreen may warn: More info, Run anyway. Blocked anyway? Use ValdoSniper-portable.zip, see SETUP.md."
          gh release view build-latest >/dev/null 2>&1 || \
            gh release create build-latest --prerelease --target "$GITHUB_SHA" --title "Latest Windows build" --notes "$notes"
          gh release upload build-latest dist/ValdoSniper-Setup.exe dist/ValdoSniper-portable.zip --clobber
          gh release edit build-latest --notes "$notes"
