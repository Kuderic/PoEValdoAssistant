name: Windows build

on:
  push:
    branches: [feat/two-client-assist, main]
  workflow_dispatch:

permissions:
  contents: write  # publish the installer to the rolling "build-latest" release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller
      - name: Tests (real Windows - the win32 paths only run here)
        run: python -m pytest -q
      - name: Build ValdoSniper.exe
        run: python -m PyInstaller --noconfirm packaging/valdo_sniper.spec
      - name: Smoke-test the exe
        shell: pwsh
        run: |
          Copy-Item tests/fixtures/replay_config.yaml dist/ValdoSniper/config.yaml
          $p = Start-Process dist/ValdoSniper/ValdoSniper.exe -ArgumentList "--headless" -WorkingDirectory dist/ValdoSniper -PassThru
          Start-Sleep 6
          $script = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8766/valdo-sniper.user.js
          Stop-Process $p
          if ($script.Content -notmatch "@version") { throw "bundled userscript not served" }
          Remove-Item dist/ValdoSniper/config.yaml
          Remove-Item -Recurse -Force dist/ValdoSniper/logs -ErrorAction SilentlyContinue
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc /DAppVersion=$v packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: ValdoSniper-Setup
          path: dist/ValdoSniper-Setup.exe
      - name: Publish to the build-latest release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Windows installer built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Unsigned: SmartScreen shows a warning, click More info, Run anyway."
          gh release view build-latest >/dev/null 2>&1 || \
            gh release create build-latest --prerelease --target "$GITHUB_SHA" --title "Latest Windows build" --notes "$notes"
          gh release upload build-latest dist/ValdoSniper-Setup.exe --clobber
          gh release edit build-latest --notes "$notes"
