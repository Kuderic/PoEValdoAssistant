# Valdo Map Sniper configuration. Secrets go in .env, never here.

# "auto" resolves the current challenge league from poe.ninja at startup;
# set an explicit league id (e.g. "Covens") to override.
league: auto

server:
  host: 127.0.0.1
  port: 8765

thresholds:
  # Minimum YIELD to alert, in DIVINE ORBS per 100 difficulty.
  #   NET   = market price - asking price - running_cost
  #   YIELD = NET / difficulty * 100
  # Reads directly as "a 100-difficulty map must net this much".
  min_yield: 2.5
  # Keyed by the map's Reward name (the value driver, e.g. "Foil Mageblood");
  # item_name is only the fallback key when a listing has no reward line.
  per_map: {}                  # e.g. "Foil Mageblood": 25
  # What running a map costs you, in divines: the time it takes plus what you
  # lose reselling. Taken off every listing BEFORE net, yield and the alert
  # cutoff are computed - which is why the column is NET, not profit. An easy
  # map with a tiny margin is not really worth doing. Editable in the ⚙ panel.
  running_cost: 1

alerts:
  expiry_seconds: 16           # a stale alert can never be traveled to by reflex
  max_display: 3               # top pick + runners-up shown on the overlay
  sound: ""                    # path to a .wav; empty -> Windows alert sound
  # Non-Valdo live-search hits are rare and usually far more profitable, so
  # they get their own sound - you can tell them apart without looking.
  # Empty -> C:\Windows\Media\tada.wav. Keep it short: alerts expire in
  # seconds and the next one cancels this one.
  generic_sound: ""
  volume: 0.5                  # 0.0-1.0, also editable in the ⚙ panel
  traveled_display_seconds: 10 # traveled map's mods stay readable this long
  copy_on_travel: true         # map name -> clipboard on travel (Ctrl+F, Ctrl+V in the shop)
  feed_rows: 40                # live-feed history rows (the area scrolls)
  # JACKPOT: a listing whose NET and YIELD BOTH clear these bars (e.g. a
  # half-price Nimis: +80d net, +144 yield). It gets a magenta banner and
  # frame, takes the hotkey's top slot, and loops an alarm until you travel,
  # it expires, or you CLICK THE BANNER to silence it (the speaker icon
  # mutes everything). It never pulls the overlay to the front.
  # Stays magenta in the live feed so a missed one is obvious later.
  # Currency mismatches never count.
  # Both bars are also editable in the ⚙ panel (saved to scoring_overrides.yaml).
  jackpot_min_net: 10          # divines
  jackpot_min_yield: 10        # divines per 100 difficulty
  jackpot_alarm: true          # false -> a jackpot plays the ordinary alert sound
  jackpot_sound: ""            # .wav to loop; empty -> C:\Windows\Media\Alarm02.wav

hotkey:
  combo: "`"
  # all: a press clears every alert | top: runners-up stay targetable.
  # Either way, a travel that FAILS (item sold, row gone) gives the
  # runners-up back so the next-best alert is immediately targetable.
  consume: all
  # TWO CLIENTS: focus the buyer client and press this once; travel then
  # always brings THAT client forward (both windows share one title).
  # Pick keys PoE does not use - both keys also reach the game. "" disables.
  mark_buyer: "ctrl+alt+b"
  # stop opening more live-search tabs mid-run (the overlay has a button too)
  stop_opening: "ctrl+alt+s"

ninja:
  enabled: true
  refresh_minutes: 10
  base_url: "https://poe.ninja"   # API paths verified 2026-08-09, see DESIGN.md

# Primary reward pricing: official trade API average of the cheapest
# listings of each active reward's unique (poe.ninja per-map medians proved
# inaccurate; ninja remains the fallback + currency rates). Runs only for
# rewards with an open live search. Filter ladder:
#   1. unidentified + uncorrupted (default)
#   2. if fewer than min_unid_listings exist: identified + uncorrupted
#      (e.g. Headhunter often has only ~2 unid listings)
#   3. if that has none either: identified + corrupted
#      (e.g. Fortress Covenant)
# corrupted_uniques skip the ladder: unid + corrupted directly.
trade_pricing:
  enabled: true
  # every active reward is re-priced each cycle, so the request rate scales
  # with the number of open live searches; 10 earned a 30-minute API backoff.
  # Until a price is this old the cached one is used, also across restarts.
  refresh_minutes: 180
  max_listings: 3          # average of the cheapest N listings (after outlier drop)
  min_unid_listings: 10
  # last session's prices are reloaded on startup (price_cache.json) so
  # listings are judged from the first second while a refresh runs; older
  # than this and they are discarded as too stale to trade on
  cache_max_age_minutes: 720
  outlier_cutoff: 0.5      # drop listings under this fraction of the sample median
  # Only instant-buyout listings count: those are all async trading can buy.
  # "any" also counts offline sellers' days-old prices and negotiable
  # "~price" listings, which undercut the real market (Headhunter read
  # ~161d that way when every buyable one was 184d+). securable|online|any
  listing_status: securable
  base_url: "https://www.pathofexile.com"
  corrupted_uniques:
    - "Impossible Escape"
    - "Forbidden Flame"
    - "Forbidden Flesh"
    - "Rain of Splinters"

# Manual chaos-denominated rates, used when poe.ninja is unavailable.
currency_rates:
  chaos: 1
  divine: 210
  exalted: 8

# Manual reference price table: fallback when poe.ninja lacks foil Valdo
# coverage, and always an override when an entry exists here.
# Keyed by Reward name (item_name fallback), like thresholds.per_map.
# For a one-off correction, the ⚙ panel's "Reward prices" section pins a
# price for the current session only; put it here to make it permanent.
prices: {}
#  "Foil Mageblood":
#    currency: divine
#    amount: 220

# Hard warn/block rules. match: case-insensitive substring by default; set
# regex: true for a regex. match_all: every pattern must hit (combo rule).
# severity: warn -> overlay chip, alert still fires
#           block -> log-only, no sound, no overlay alert, regardless of profit
mod_warnings: []
#  - label: "no regen"
#    match: "cannot regenerate"
#    severity: block

# Deadly PAIRINGS: mods that are far worse together than their individual
# multipliers imply. Each multiplies the difficulty on top of the normal
# rules and raises a red warning carrying its note, because it is the
# combination - not either mod alone - that makes the map unrunnable.
# Multipliers are editable in the ⚙ panel; match patterns stay here.
mod_pairings:
  - label: "No damage + fatal timer"
    match_all: ["less damage per equipped item", "becomes fatal"]
    multiplier: 10
    note: "Impossible unless DPS-check build"
  - label: "Delirium + fatal timer"
    match_all: ["100% delirious", "becomes fatal"]
    multiplier: 10
    note: "Impossible unless DPS-check build"
  # (Ultimatum + delirium / no damage used to be pairings here; they are a
  # chance of FAILING the map, so they now live in mod_risks below.)
  - label: "Blight + melee-range only"
    match_all: ["blight", "within 2 metres of a player"]
    multiplier: 2
    note: "Bricks the CC tower strategy"
  # Void alone is survivable - you simply do not die. It is The Feared that
  # makes it lethal: a fight that can one-shot you, in a map where dying
  # deletes the character. Stacks on top of the VOID and The Feared rules.
  - label: "The Feared + void"
    match_all: ["area contains the feared", "sent to the void"]
    multiplier: 2
    note: "The Feared can one-shot; dying here deletes the character"

# FAILURE RISKS: mods (or combinations) that can make the map FAIL. A failed
# map pays nothing and what you paid for it is gone, so each risk turns NET
# into an expected value:
#   NET = (1 - fail_chance) x market price - asking price - running cost
# fail_chance is 0-1 (0.3 = 30%). Several risks on one map combine as
# independent chances (two 30% risks = 51%). 1.0 means it can never pay off,
# so it never alerts. 0 switches a risk off. The chances are editable in the
# ⚙ panel (saved to scoring_overrides.yaml); match patterns stay here.
# "Less damage or delirium": the second pattern is a regex alternation.
mod_risks:
  # Even a clean Ultimatum can brick the map. `unless` hands the map to the
  # more specific entry below when less damage or delirium is present, so
  # the two never stack: 10% alone, 25% with the penalty.
  - label: "Ultimatum"
    match: "an ultimatum encounter|ultimatum encounter waves|ultimatum modifier"
    unless: "less damage per equipped item|100% delirious"
    regex: true
    fail_chance: 0.10
    note: "Can brick the map even without penalties"
  # 25% overall: Protect the Altar does not roll every time, but when it
  # does, less damage or delirium usually fails it.
  - label: "Ultimatum + less damage/delirium"
    match_all:
      - "an ultimatum encounter|ultimatum encounter waves|ultimatum modifier"
      - "less damage per equipped item|100% delirious"
    regex: true
    fail_chance: 0.25
    note: "Protect the Altar is likely to fail"
  - label: "Breach + less damage/delirium"
    match_all:
      - "unstable breaches must be stabilised"
      - "less damage per equipped item|100% delirious"
    regex: true
    fail_chance: 1.0
    note: "Breaches can't be stabilised: unclearable"
  - label: "Bismuth"
    match: "bismuth"
    fail_chance: 0.30
    note: "Bismuth maps bug out and fail"

# Difficulty scoring. Every listing gets:
#   score = max(base_default, min_base of matched rules) x product(multipliers)
#   required net = thresholds.min_yield x score / 100
# (the base threshold is what a 100-difficulty map needs; 200 difficulty
# doubles it, 50 halves it). warning: red|yellow rules also
# show a special chip on the overlay. Match texts are derived from known mod
# lines - every listing's full mod list is logged (logs/*.jsonl), so verify
# and tune these against real captures.
mod_scoring:
  base_default: 40
  rules:
    # --- league mechanics and death risks: these also raise an
    #     overlay chip (red = can lose the character, yellow = note)
    - { label: "VOID", match: "sent to the void", multiplier: 2.0, warning: red }
    - { label: "LEGION", match: "legion", multiplier: 2.0, warning: red }
    # Three-liner: the stabilise-and-close requirement, the extra-breach
    # count ("an"/"2"/"3 additional") and the breach boss line always
    # appear together.
    - label: "BREACH"
      match_all:
        - "unstable breaches must be stabilised"
        - "additional unstable breach"
        - "unstable breaches in area contain a boss"
      multiplier: 2.0
      warning: yellow
    # Excludes "Area has no chance to contain Ultimatum Encounters".
    - label: "ULTIMATUM"
      match: "an ultimatum encounter|ultimatum encounter waves|ultimatum modifier"
      regex: true
      multiplier: 1.5
      warning: yellow
    - { label: "BISMUTH", match: "bismuth", warning: yellow }
    - { label: "BLIGHT", match: "blight", warning: yellow }

    # --- base difficulty: the map's floor, highest wins (not summed)
    - { label: "The Feared", match: "area contains the feared", min_base: 100 }
    - { label: "Einhar", match: "einhar", min_base: 70 }
    - { label: "The Elderslayers", match: "area contains the elderslayers", min_base: 70 }
    - { label: "The Remembered", match: "area contains the remembered", min_base: 70 }
    - { label: "The Twisted", match: "area contains the twisted", min_base: 70 }
    - { label: "Gigantic Rogue Exiles", match: "gigantic rogue exiles", min_base: 60 }
    - label: "Invitation boss"
      match: "area contains the (hidden|formed|forgotten)"
      regex: true
      min_base: 60
    - { label: "Kitava's Heralds", match: "kitava's heralds", min_base: 40 }
    - { label: "Packs of four Map Bosses", match: "packs of four map bosses", min_base: 50 }
    - { label: "Frost Wall rares", match: "create frost walls", min_base: 25 }
    - { label: "Porcupines", match: "porcupine", min_base: 25 }
    - { label: "Restless Dead", match: "restless dead", min_base: 25 }

    # --- multipliers: every match scales the final score
    - { label: "Fatal after time", match: "becomes fatal", multiplier: 1.5 }
    - { label: "Players cannot Block", match: "players cannot block", multiplier: 2.5 }
    # Two-liner: player line + minions line.
    - label: "Less damage per item"
      match_all:
        - "less damage per equipped item"
        - "less damage per item equipped"
      multiplier: 3.0
    - { label: "Shroud Walker", match: "shroud walker", multiplier: 1.5 }
    - { label: "100% Delirious", match: "100% delirious", multiplier: 2.0 }
    - { label: "2 random Shrine Buffs", match: "random shrine buffs", multiplier: 1.4 }
    - label: "3-4 Tormented Spirits"
      match: "possessed by 3 to 4 tormented spirits"
      multiplier: 2.0
    - { label: "Increasingly lethal", match: "increasingly lethal", multiplier: 1.8 }
    - label: "Reduced Non-Curse Auras"
      match: "reduced effect of non-curse auras"
      multiplier: 1.4
    - { label: "Instability on Kill", match: "instability on kill", multiplier: 1.5 }
    - label: "2-3 Tormented Spirits"
      match: "possessed by 2 to 3 tormented spirits"
      multiplier: 1.7
    - label: "Players cannot suppress spell damage"
      match: "cannot suppress spell damage"
      multiplier: 1.0
    # Two-liner: "Travel Skills are Disabled" + "50% reduced Movement Speed".
    - label: "Travel Skills Disabled + slow"
      match_all:
        - "travel skills are disabled"
        - "reduced movement speed"
      multiplier: 1.4
    - label: "1-2 Tormented Spirits"
      match: "possessed by 1 to 2 tormented spirits"
      multiplier: 1.3
    - { label: "Extra random map mods", match: "additional random modifiers", multiplier: 1.4 }
    # Two-liner: "deal 100% more Damage" + "have 200% more Life".
    - label: "Runic monsters"
      match_all:
        - "runic monsters deal"
        - "runic monsters have"
      multiplier: 1.2
    - { label: "6 additional projectiles", match: "fire 6 additional projectiles", multiplier: 1.0 }
    # "apparitions", not "players are assaulted by": Ruinous Ghosts share
    # that opening and are scored on their own below.
    - { label: "Apparitions", match: "apparitions", multiplier: 1.2 }
    - { label: "Ruinous Ghosts", match: "ruinous ghosts", multiplier: 1.5 }
    - { label: "Driven mad", match: "driven mad", multiplier: 1.3 }
    - { label: "Enrage on Low Life", match: "enrage on low life", multiplier: 1.3 }
    - { label: "Melee-range damage only", match: "within 2 metres of a player", multiplier: 1.1 }
    # Replaced the old reflect mods. Two-liner: the physical and elemental
    # thorns lines always appear together. Matched on "thorns" not
    # "reflect" - the lines read "...Thorns reflecting 4000 ... Damage".
    - label: "Thorns"
      match_all:
        - "physical thorns"
        - "elemental thorns"
      multiplier: 1.2
    # Real wording: "Only opens 1 Portal to Area".
    - { label: "1 portal", match: "only opens 1 portal", multiplier: 1.3 }
    - { label: "Malediction on hit", match: "inflict malediction", multiplier: 1.2 }
    - { label: "Maven interference", match: "maven interferes", multiplier: 1.2 }
    - { label: "Meteors", match: "randomly targeted by meteors", multiplier: 1.1 }
    - label: "No recovery above 50% in Rituals"
      match: "recover life or energy shield above"
      multiplier: 1.3
    - { label: "Petrification on hit", match: "inflict petrification", multiplier: 1.2 }
    - { label: "Rares extra modifiers", match: "rare monsters each have", multiplier: 1.2 }
    - { label: "Slower debuff expiry", match: "debuffs on players expire", multiplier: 1.1 }
    # Charge two-liners: "gain a X charge on hit" + "+6 to maximum X charges".
    - label: "Endurance Charges"
      match_all:
        - "gain an endurance charge on hit"
        - "to maximum endurance charges"
      multiplier: 1.15
    - label: "Frenzy Charges"
      match_all:
        - "gain a frenzy charge on hit"
        - "to maximum frenzy charges"
      multiplier: 1.25
    - label: "Power Charges"
      match_all:
        - "gain a power charge on hit"
        - "to maximum power charges"
      multiplier: 1.15
    - { label: "Creeping Agony", match: "creeping agony", multiplier: 1.1 }
    - { label: "Deatomisation Storms", match: "deatomisation storms", multiplier: 1.1 }
    - { label: "Grasping Vines", match: "grasping vine", multiplier: 1.1 }
    - { label: "Maddening Tentacles", match: "maddening tentacles", multiplier: 1.1 }
    - { label: "Cull on hit", match: "or lower life on hit", multiplier: 1.0 }
    - { label: "No Flask Charges", match: "cannot gain flask charges", multiplier: 1.0 }
    - { label: "Players cannot Evade", match: "players cannot evade", multiplier: 1.0 }

game:
  process_names:
    - PathOfExile.exe
    - PathOfExile_x64.exe
    - PathOfExileSteam.exe
    - PathOfExile_KG.exe
  window_title: "Path of Exile"

logging:
  level: INFO
  dir: logs
