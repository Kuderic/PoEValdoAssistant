# Valdo Map Sniper configuration. Secrets go in .env, never here.

# "auto" resolves the current challenge league from poe.ninja at startup;
# set an explicit league id (e.g. "Allflame") to override.
league: auto

server:
  host: 127.0.0.1
  port: 8765

thresholds:
  # Profit thresholds in DIVINE ORBS (absolute, not %): alert when
  # (reference - listing), normalized to divines, is at least this much.
  global_profit_div: 2
  # Keyed by the map's Reward name (the value driver, e.g. "Foil Mageblood");
  # item_name is only the fallback key when a listing has no reward line.
  per_map: {}                  # e.g. "Foil Mageblood": 25
  # Fixed divine toll taken off every listing's profit before profit, P/100D
  # and the alert cutoff are computed: running any map costs time, so an easy
  # map with a tiny margin is not really worth it. Editable in the ⚙ panel.
  flat_profit_reduction: 1

alerts:
  expiry_seconds: 16           # a stale alert can never be traveled to by reflex
  max_display: 3               # top pick + runners-up shown on the overlay
  sound: ""                    # path to a .wav; empty -> Windows alert sound
  volume: 0.5                  # 0.0-1.0, also editable in the ⚙ panel
  traveled_display_seconds: 10 # traveled map's mods stay readable this long
  feed_rows: 40                # live-feed history rows (the area scrolls)

hotkey:
  combo: "`"
  consume: all                 # all: a press clears every alert | top: runners-up stay targetable

ninja:
  enabled: true
  refresh_minutes: 10
  base_url: "https://poe.ninja"   # API paths verified 2026-08-09, see DESIGN.md

# Primary reward pricing: official trade API average of the cheapest
# listings of each active reward's unique (poe.ninja per-map medians proved
# inaccurate; ninja remains the fallback + currency rates). Runs only for
# rewards with an open live search. Filter ladder:
#   1. unidentified + uncorrupted (default)
#   2. if fewer than min_unid_listings exist: identified + uncorrupted
#      (e.g. Headhunter often has only ~2 unid listings)
#   3. if that has none either: identified + corrupted
#      (e.g. Fortress Covenant)
# corrupted_uniques skip the ladder: unid + corrupted directly.
trade_pricing:
  enabled: true
  refresh_minutes: 10
  max_listings: 3          # average of the cheapest N listings (after outlier drop)
  min_unid_listings: 10
  # last session's prices are reloaded on startup (price_cache.json) so
  # listings are judged from the first second while a refresh runs; older
  # than this and they are discarded as too stale to trade on
  cache_max_age_minutes: 720
  outlier_cutoff: 0.5      # drop listings under this fraction of the sample median
  base_url: "https://www.pathofexile.com"
  corrupted_uniques:
    - "Impossible Escape"
    - "Forbidden Flame"
    - "Forbidden Flesh"
    - "Rain of Splinters"

# Manual chaos-denominated rates, used when poe.ninja is unavailable.
currency_rates:
  chaos: 1
  divine: 210
  exalted: 8

# Manual reference price table: fallback when poe.ninja lacks foil Valdo
# coverage, and always an override when an entry exists here.
# Keyed by Reward name (item_name fallback), like thresholds.per_map.
prices: {}
#  "Foil Mageblood":
#    currency: divine
#    amount: 220

# Hard warn/block rules. match: case-insensitive substring by default; set
# regex: true for a regex. match_all: every pattern must hit (combo rule).
# severity: warn -> overlay chip, alert still fires
#           block -> log-only, no sound, no overlay alert, regardless of profit
mod_warnings: []
#  - label: "no regen"
#    match: "cannot regenerate"
#    severity: block

# Deadly PAIRINGS: mods that are far worse together than their individual
# multipliers imply. Each multiplies the difficulty on top of the normal
# rules and raises a red warning carrying its note, because it is the
# combination - not either mod alone - that makes the map unrunnable.
# Multipliers are editable in the ⚙ panel; match patterns stay here.
mod_pairings:
  - label: "No damage + fatal timer"
    match_all: ["less damage per equipped item", "becomes fatal"]
    multiplier: 10
    note: "Impossible unless DPS-check build"
  - label: "Delirium + fatal timer"
    match_all: ["100% delirious", "becomes fatal"]
    multiplier: 10
    note: "Impossible unless DPS-check build"
  # regex on both sides so the ultimatum pattern can exclude
  # "Area has no chance to contain Ultimatum Encounters"
  - label: "Ultimatum + delirium"
    match_all:
      - "an ultimatum encounter|ultimatum encounter waves|ultimatum modifier"
      - "100% delirious"
    regex: true
    multiplier: 2
    note: "Almost certain to fail Protect the Altar"
  - label: "Ultimatum + no damage"
    match_all:
      - "an ultimatum encounter|ultimatum encounter waves|ultimatum modifier"
      - "less damage per equipped item"
    regex: true
    multiplier: 2
    note: "Almost certain to fail Protect the Altar"
  - label: "Blight + melee-range only"
    match_all: ["blight", "within 2 metres of a player"]
    multiplier: 2
    note: "Bricks the CC tower strategy"

# Difficulty scoring. Every listing gets:
#   score = max(base_default, min_base of matched rules) x product(multipliers)
#   required profit = thresholds.global_profit_div x score / 100
# (the base threshold is what a 100-difficulty map needs; 200 difficulty
# doubles it, 50 halves it). warning: red|yellow rules also
# show a special chip on the overlay. Match texts are derived from known mod
# lines - every listing's full mod list is logged (logs/*.jsonl), so verify
# and tune these against real captures.
mod_scoring:
  base_default: 40
  rules:
    # --- league mechanics and death risks: these also raise an
    #     overlay chip (red = can lose the character, yellow = note)
    - { label: "VOID", match: "sent to the void", multiplier: 2.4, warning: red }
    - { label: "LEGION", match: "legion", multiplier: 2.0, warning: red }
    # Three-liner: the stabilise-and-close requirement, the extra-breach
    # count ("an"/"2"/"3 additional") and the breach boss line always
    # appear together.
    - label: "BREACH"
      match_all:
        - "unstable breaches must be stabilised"
        - "additional unstable breach"
        - "unstable breaches in area contain a boss"
      multiplier: 1.5
      warning: yellow
    # Excludes "Area has no chance to contain Ultimatum Encounters".
    - label: "ULTIMATUM"
      match: "an ultimatum encounter|ultimatum encounter waves|ultimatum modifier"
      regex: true
      multiplier: 1.5
      warning: yellow
    - { label: "BISMUTH", match: "bismuth", warning: yellow }
    - { label: "BLIGHT", match: "blight", warning: yellow }

    # --- base difficulty: the map's floor, highest wins (not summed)
    - { label: "The Feared", match: "area contains the feared", min_base: 120 }
    - { label: "Einhar", match: "einhar", min_base: 90 }
    - { label: "The Elderslayers", match: "area contains the elderslayers", min_base: 80 }
    - { label: "The Remembered", match: "area contains the remembered", min_base: 80 }
    - { label: "The Twisted", match: "area contains the twisted", min_base: 70 }
    - { label: "Gigantic Rogue Exiles", match: "gigantic rogue exiles", min_base: 60 }
    - label: "Invitation boss"
      match: "area contains the (hidden|formed|forgotten)"
      regex: true
      min_base: 60
    - { label: "Kitava's Heralds", match: "kitava's heralds", min_base: 60 }
    - { label: "Packs of four Map Bosses", match: "packs of four map bosses", min_base: 60 }
    - { label: "Frost Wall rares", match: "create frost walls", min_base: 40 }
    - { label: "Porcupines", match: "porcupine", min_base: 40 }
    - { label: "Restless Dead", match: "restless dead", min_base: 40 }

    # --- multipliers: every match scales the final score
    - { label: "Fatal after time", match: "becomes fatal", multiplier: 2.5 }
    - { label: "Players cannot Block", match: "players cannot block", multiplier: 2.5 }
    # Two-liner: player line + minions line.
    - label: "Less damage per item"
      match_all:
        - "less damage per equipped item"
        - "less damage per item equipped"
      multiplier: 2.4
    - { label: "Shroud Walker", match: "shroud walker", multiplier: 2.2 }
    - { label: "100% Delirious", match: "100% delirious", multiplier: 2.0 }
    - { label: "2 random Shrine Buffs", match: "random shrine buffs", multiplier: 2.0 }
    - label: "3-4 Tormented Spirits"
      match: "possessed by 3 to 4 tormented spirits"
      multiplier: 2.0
    - { label: "Increasingly lethal", match: "increasingly lethal", multiplier: 2.0 }
    - label: "Reduced Non-Curse Auras"
      match: "reduced effect of non-curse auras"
      multiplier: 2.0
    - { label: "Instability on Kill", match: "instability on kill", multiplier: 1.8 }
    - label: "2-3 Tormented Spirits"
      match: "possessed by 2 to 3 tormented spirits"
      multiplier: 1.7
    - label: "Players cannot suppress spell damage"
      match: "cannot suppress spell damage"
      multiplier: 1.6
    # Two-liner: "Travel Skills are Disabled" + "50% reduced Movement Speed".
    - label: "Travel Skills Disabled + slow"
      match_all:
        - "travel skills are disabled"
        - "reduced movement speed"
      multiplier: 1.5
    - label: "1-2 Tormented Spirits"
      match: "possessed by 1 to 2 tormented spirits"
      multiplier: 1.4
    - { label: "Extra random map mods", match: "additional random modifiers", multiplier: 1.4 }
    # Two-liner: "deal 100% more Damage" + "have 200% more Life".
    - label: "Runic monsters"
      match_all:
        - "runic monsters deal"
        - "runic monsters have"
      multiplier: 1.4
    - { label: "6 additional projectiles", match: "fire 6 additional projectiles", multiplier: 1.3 }
    - { label: "Apparitions", match: "players are assaulted by", multiplier: 1.3 }
    - { label: "Driven mad", match: "driven mad", multiplier: 1.3 }
    - { label: "Enrage on Low Life", match: "enrage on low life", multiplier: 1.3 }
    - { label: "Melee-range damage only", match: "within 2 metres of a player", multiplier: 1.3 }
    # Replaced the old reflect mods. Two-liner: the physical and elemental
    # thorns lines always appear together. Matched on "thorns" not
    # "reflect" - the lines read "...Thorns reflecting 4000 ... Damage".
    - label: "Thorns"
      match_all:
        - "physical thorns"
        - "elemental thorns"
      multiplier: 1.3
    # Real wording: "Only opens 1 Portal to Area".
    - { label: "1 portal", match: "only opens 1 portal", multiplier: 1.2 }
    - { label: "Malediction on hit", match: "inflict malediction", multiplier: 1.2 }
    - { label: "Maven interference", match: "maven interferes", multiplier: 1.2 }
    - { label: "Meteors", match: "randomly targeted by meteors", multiplier: 1.2 }
    - label: "No recovery above 50% in Rituals"
      match: "recover life or energy shield above"
      multiplier: 1.2
    - { label: "Petrification on hit", match: "inflict petrification", multiplier: 1.2 }
    - { label: "Rares extra modifiers", match: "rare monsters each have", multiplier: 1.2 }
    - { label: "Slower debuff expiry", match: "debuffs on players expire", multiplier: 1.2 }
    # Charge two-liners: "gain a X charge on hit" + "+6 to maximum X charges".
    - label: "Endurance Charges"
      match_all:
        - "gain an endurance charge on hit"
        - "to maximum endurance charges"
      multiplier: 1.15
    - label: "Frenzy Charges"
      match_all:
        - "gain a frenzy charge on hit"
        - "to maximum frenzy charges"
      multiplier: 1.15
    - label: "Power Charges"
      match_all:
        - "gain a power charge on hit"
        - "to maximum power charges"
      multiplier: 1.15
    - { label: "Creeping Agony", match: "creeping agony", multiplier: 1.1 }
    - { label: "Deatomisation Storms", match: "deatomisation storms", multiplier: 1.1 }
    - { label: "Grasping Vines", match: "grasping vine", multiplier: 1.1 }
    - { label: "Maddening Tentacles", match: "maddening tentacles", multiplier: 1.1 }
    - { label: "Cull on hit", match: "or lower life on hit", multiplier: 1.0 }
    - { label: "No Flask Charges", match: "cannot gain flask charges", multiplier: 1.0 }
    - { label: "Players cannot Evade", match: "players cannot evade", multiplier: 1.0 }

game:
  process_names:
    - PathOfExile.exe
    - PathOfExile_x64.exe
    - PathOfExileSteam.exe
    - PathOfExile_KG.exe
  window_title: "Path of Exile"

logging:
  level: INFO
  dir: logs
