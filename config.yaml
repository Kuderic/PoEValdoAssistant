# Valdo Map Sniper configuration. Secrets go in .env, never here.

# "auto" resolves the current challenge league from poe.ninja at startup;
# set an explicit league id (e.g. "Allflame") to override.
league: auto

server:
  host: 127.0.0.1
  port: 8765

thresholds:
  # Profit thresholds in DIVINE ORBS (absolute, not %): alert when
  # (reference - listing), normalized to divines, is at least this much.
  global_profit_div: 6
  # Keyed by the map's Reward name (the value driver, e.g. "Foil Mageblood");
  # item_name is only the fallback key when a listing has no reward line.
  per_map: {}                  # e.g. "Foil Mageblood": 25

alerts:
  expiry_seconds: 16           # a stale alert can never be traveled to by reflex
  max_display: 3               # top pick + runners-up shown on the overlay
  sound: ""                    # path to a .wav; empty -> system beep
  traveled_display_seconds: 10 # traveled map's mods stay readable this long
  feed_rows: 6                 # live-feed rows (all listings, alerting or not)

hotkey:
  combo: "ctrl+alt+t"
  consume: all                 # all: a press clears every alert | top: runners-up stay targetable

ninja:
  enabled: true
  refresh_minutes: 10
  base_url: "https://poe.ninja"   # API paths verified 2026-08-09, see DESIGN.md

# Primary reward pricing: official trade API average of the cheapest
# unidentified, uncorrupted copies of each active reward's unique
# (poe.ninja per-map medians proved inaccurate; ninja remains the fallback
# + currency rates). Runs only for rewards with an open live search.
trade_pricing:
  enabled: true
  refresh_minutes: 10
  max_listings: 3          # average of the cheapest N listings
  base_url: "https://www.pathofexile.com"
  # These only exist corrupted, so they are searched with corrupted: yes
  corrupted_uniques:
    - "Impossible Escape"
    - "The Adorned"
    - "Forbidden Flame"
    - "Forbidden Flesh"

# Manual chaos-denominated rates, used when poe.ninja is unavailable.
currency_rates:
  chaos: 1
  divine: 180
  exalted: 8

# Manual reference price table: fallback when poe.ninja lacks foil Valdo
# coverage, and always an override when an entry exists here.
# Keyed by Reward name (item_name fallback), like thresholds.per_map.
prices: {}
#  "Foil Mageblood":
#    currency: divine
#    amount: 220

# Hard warn/block rules. match: case-insensitive substring by default; set
# regex: true for a regex. match_all: every pattern must hit (combo rule).
# severity: warn -> overlay chip, alert still fires
#           block -> log-only, no sound, no overlay alert, regardless of profit
mod_warnings: []
#  - label: "no regen"
#    match: "cannot regenerate"
#    severity: block

# Difficulty scoring. Every listing gets:
#   score = max(base_default, min_base of matched rules) x product(multipliers)
#   required profit = thresholds.global_profit_div x score / 100
# (the base threshold is what a 100-difficulty map needs; 200 difficulty
# doubles it, 50 halves it). warning: red|yellow rules also
# show a special chip on the overlay. Match texts are derived from known mod
# lines - every listing's full mod list is logged (logs/*.jsonl), so verify
# and tune these against real captures.
mod_scoring:
  base_default: 25
  rules:
    - { label: "The Feared", match: "area contains the feared", min_base: 100 }
    - { label: "100% Delirious", match: "100% delirious", multiplier: 1.8 }
    - { label: "Porcupines", match: "porcupine", min_base: 20 }
    - { label: "The Twisted", match: "area contains the twisted", min_base: 50 }
    - label: "3-4 Tormented Spirits"
      match: "possessed by 3 to 4 tormented spirits"
      multiplier: 2.2
    - { label: "VOID", match: "sent to the void", multiplier: 2.0, warning: red }
    - { label: "BISMUTH", match: "bismuth", warning: yellow }
    - { label: "BLIGHT", match: "blight", warning: yellow }
    - { label: "Einhar", match: "einhar", min_base: 80 }
    - { label: "Increasingly lethal", match: "increasingly lethal", multiplier: 1.7 }
    - { label: "Fatal after time", match: "becomes fatal", multiplier: 2.0 }
    - { label: "Reflect", match: "reflect", multiplier: 1.1 }
    - label: "Invitation boss"
      match: "area contains the (hidden|formed|forgotten)"
      regex: true
      min_base: 60
    - label: "Players cannot suppress spell damage"
      match: "cannot suppress spell damage"
      multiplier: 1.3
    - label: "Less damage per item"
      match: "less damage per equipped item"
      multiplier: 2.3
    - label: "6 additional projectiles"
      match: "fire 6 additional projectiles"
      multiplier: 1.2
    - label: "1 portal"
      match: "only opens 1 portal"    # real wording: "Only opens 1 Portal to Area"
      multiplier: 1.1
    # --- base difficulty mods (batch added from snapshot corpus) ---
    - { label: "The Elderslayers", match: "area contains the elderslayers", min_base: 70 }
    - { label: "The Remembered", match: "area contains the remembered", min_base: 60 }
    - { label: "Packs of four Map Bosses", match: "packs of four map bosses", min_base: 50 }
    - { label: "Kitava's Heralds", match: "kitava's heralds", min_base: 40 }
    - { label: "Restless Dead", match: "restless dead", min_base: 40 }
    - { label: "Gigantic Rogue Exiles", match: "gigantic rogue exiles", min_base: 40 }
    - { label: "Frost Wall rares", match: "create frost walls", min_base: 40 }
    # --- multipliers (batch added from snapshot corpus) ---
    - { label: "2 random Shrine Buffs", match: "random shrine buffs", multiplier: 2.0 }
    - { label: "Meteors", match: "randomly targeted by meteors", multiplier: 1.3 }
    - { label: "Apparitions", match: "players are assaulted by", multiplier: 1.3 }
    - { label: "Deatomisation Storms", match: "deatomisation storms", multiplier: 1.1 }
    - { label: "Melee-range damage only", match: "within 2 metres of a player", multiplier: 1.2 }
    - { label: "Players cannot Block", match: "players cannot block", multiplier: 2.5 }
    - { label: "Players cannot Evade", match: "players cannot evade", multiplier: 1.0 }
    - { label: "No Flask Charges", match: "cannot gain flask charges", multiplier: 1.0 }
    - { label: "Travel Skills Disabled", match: "travel skills are disabled", multiplier: 1.4 }
    - { label: "Reduced Non-Curse Auras", match: "reduced effect of non-curse auras", multiplier: 1.6 }
    - { label: "Petrification on hit", match: "inflict petrification", multiplier: 1.4 }
    - { label: "Malediction on hit", match: "inflict malediction", multiplier: 1.2 }
    - { label: "Grasping Vines", match: "grasping vine", multiplier: 1.2 }
    - { label: "Runic monster damage", match: "runic monsters deal", multiplier: 1.2 }
    - { label: "Runic monster life", match: "runic monsters have", multiplier: 1.2 }
    - { label: "Enrage on Low Life", match: "enrage on low life", multiplier: 1.2 }
    - { label: "Cull on hit", match: "or lower life on hit", multiplier: 1.0 }
    - { label: "Rares extra modifiers", match: "rare monsters each have", multiplier: 1.1 }
    - { label: "Extra random map mods", match: "additional random modifiers", multiplier: 1.3 }
    - label: "Max Frenzy Charges"
      match: "to maximum frenzy charges"
      multiplier: 1.15
    - label: "Max Power Charges"
      match: "to maximum power charges"
      multiplier: 1.15
    - label: "Max Endurance Charges"
      match: "to maximum endurance charges"
      multiplier: 1.15
    - label: "Frenzy Charge on Hit"
      match: "gain a frenzy charge on hit"
      multiplier: 1.15
    - label: "Power Charge on Hit"
      match: "gain a power charge on hit"
      multiplier: 1.15
    - label: "Endurance Charge on Hit"
      match: "gain an endurance charge on hit"
      multiplier: 1.15
    - { label: "Maven interference", match: "maven interferes", multiplier: 1.2 }
    - { label: "Maddening Tentacles", match: "maddening tentacles", multiplier: 1.1 }
    - { label: "Creeping Agony", match: "creeping agony", multiplier: 1.1 }
    - { label: "Driven mad", match: "driven mad", multiplier: 1.2 }
    - { label: "Slower debuff expiry", match: "debuffs on players expire", multiplier: 1.2 }
    - { label: "Instability on Kill", match: "instability on kill", multiplier: 1.5 }
    - label: "No recovery above 50% in Rituals"
      match: "recover life or energy shield above"
      multiplier: 1.2
    - { label: "LEGION", match: "legion", multiplier: 1.0, warning: yellow }
    # excludes "Area has no chance to contain Ultimatum Encounters"
    - label: "ULTIMATUM"
      match: "an ultimatum encounter|ultimatum encounter waves|ultimatum modifier"
      regex: true
      multiplier: 1.0
      warning: yellow

game:
  process_names:
    - PathOfExile.exe
    - PathOfExile_x64.exe
    - PathOfExileSteam.exe
    - PathOfExile_KG.exe
  window_title: "Path of Exile"

logging:
  level: INFO
  dir: logs
