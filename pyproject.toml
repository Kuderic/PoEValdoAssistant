[project]
name = "poe-valdo-sniper"
version = "0.1.0"
description = "Valdo's Puzzle Box foil map sniper for the PoE trade site live search"
requires-python = ">=3.12"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "keyboard>=0.13.5",
    "pygetwindow>=0.0.9",
    "pywin32>=306; sys_platform == 'win32'",
    "psutil>=5.9",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
