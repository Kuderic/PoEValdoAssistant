# Deterministic config for the M2 acceptance replay: ninja disabled, manual
# prices and rates only, so decisions are reproducible offline.

league: "Allflame"

# 8766 so the acceptance replay never collides with a live sniper/echo server
server: { host: 127.0.0.1, port: 8766 }

thresholds:
  global_profit_div: 20    # divine orbs of profit required to alert
  per_map: {}

alerts: { expiry_seconds: 12, max_display: 3, sound: "" }
hotkey: { combo: "ctrl+alt+t", consume: all }

ninja: { enabled: false, refresh_minutes: 10, base_url: "https://poe.ninja" }

currency_rates:
  chaos: 1
  divine: 180
  exalted: 2

prices:
  "Foil Mageblood": { currency: divine, amount: 200 }

mod_warnings:
  - label: "no regen"
    match: "cannot regenerate"
    severity: warn
  - label: "no flasks"
    match: "cannot use flasks"
    severity: block

mod_scoring:
  base_default: 25
  div_per_point: 0.2
  rules:
    - { label: "The Feared", match: "area contains the feared", min_base: 100 }
    - { label: "100% Delirious", match: "100% delirious", multiplier: 1.8 }
    - { label: "VOID", match: "sent to the void", multiplier: 2.0, warning: true }

game:
  process_names: [PathOfExile.exe, PathOfExile_x64.exe, PathOfExileSteam.exe]
  window_title: "Path of Exile"

logging: { level: INFO, dir: logs }
